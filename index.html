function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function computePercent(suspicionRaw, roundsCompleted, selectedRounds) {
  if (roundsCompleted === 0) return 0;
  var maxSum = selectedRounds.slice(0, roundsCompleted).reduce(function (sum, r) {
    return sum + Math.max.apply(null, r.choices.map(function (c) { return c.delta; }));
  }, 0);
  if (maxSum === 0) return 0;
  return Math.min(100, Math.round((suspicionRaw / maxSum) * 100));
}
