<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>靈魂互換！？假裝直男大作戰！</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei",
      "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
    background: #f5f4f2;
    color: #1c1917;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Hero */
  main.main-idle { padding-top: 44px; padding-bottom: 16px; }
  main.main-game { padding-top: 12px; padding-bottom: 12px; }

  /* 用 class 選擇器（優先權高於標籤選擇器 h1）來確保樣式不會被其他規則覆蓋 */
  .hero-title {
    font-size: clamp(48px, 13vw, 80px) !important;
    font-weight: 900 !important;
    line-height: 1.0 !important;
    letter-spacing: -0.04em !important;
    margin: 0 !important;
    word-break: keep-all;
  }
  .hero-subtitle {
    font-size: 14px;
    color: #a8a29e;
    margin-top: 20px;
  }

  /* Game frame: 用來把整個遊戲互動區跟上方標題明確分隔開 */
  .game-frame {
    border-top: 2px solid #d6d3d1;
    border-bottom: 2px solid #d6d3d1;
    padding: 16px 0;
    margin-top: 28px;
  }
  .game-frame.no-title-margin { margin-top: 0; }

  /* Generic section spacing */
  .section { margin-top: 20px; }
  .game-frame > .section:first-child { margin-top: 0; }

  /* CTA 開始挑戰按鈕（idle 畫面唯一的操作項） */
  .cta-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 0 8px;
  }
  .cta-btn {
    width: 100%;
    max-width: 320px;
    background: #1c1917;
    color: #fff;
    padding: 20px;
    border-radius: 18px;
    font-weight: 700;
    font-size: 18px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(28,25,23,0.18);
    transition: transform .15s, background .15s;
  }
  .cta-btn:hover { background: #292524; transform: translateY(-2px); }

  /* Story screen（開場故事敘述） */
  .story-card {
    background: #1c1917;
    border-radius: 20px;
    padding: 28px 26px;
    text-align: center;
  }
  .story-icon { font-size: 32px; margin-bottom: 12px; }
  .story-text {
    color: #e7e5e4;
    font-size: 14px;
    line-height: 1.85;
    text-align: left;
    white-space: pre-line;
  }
  .story-warning {
    margin-top: 16px;
    padding: 12px 14px;
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.35);
    border-radius: 12px;
    color: #fca5a5;
    font-size: 12px;
    line-height: 1.6;
    text-align: left;
  }
  .story-btn {
    width: 100%;
    background: #fff;
    color: #1c1917;
    padding: 13px;
    border-radius: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    margin-top: 20px;
    font-size: 15px;
  }
  .story-btn:hover { background: #e7e5e4; }

  .intro-text {
    font-size: 14px;
    color: #57534e;
    line-height: 1.75;
  }

  .preview-label {
    text-align: center;
    font-size: 12px;
    color: #a8a29e;
    margin-bottom: 16px;
  }

  /* Chat bubbles (shared) */
  .bubble-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 6px; }
  .bubble-row.right { justify-content: flex-end; }
  .bubble-row.incoming { align-items: flex-end; }
  .bubble-row.ending-quote-row { justify-content: center; margin: 4px 0 4px; }
  .bubble {
    background: #fff;
    border: 1px solid #e7e5e4;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 10px 14px;
    max-width: 230px;
    font-size: 13.5px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    white-space: pre-line;
    line-height: 1.45;
  }
  .bubble.sent {
    background: #06C755;
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
    border-bottom-left-radius: 18px;
    max-width: 230px;
  }
  .bubble.faint {
    background: #fafaf9;
    color: #a8a29e;
    border-bottom-right-radius: 4px;
    border-bottom-left-radius: 18px;
  }
  .bubble.twist {
    background: #fef2f2;
    border-color: #fecaca;
    color: #b91c1c;
  }
  .bubble.timeout {
    background: #d6d3d1;
    color: #57534e;
    font-style: italic;
  }

  /* LINE 風格頭像（訊息旁的小頭像） */
  .line-avatar-mini {
    width: 24px;
    height: 24px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
    flex-shrink: 0;
  }

  /* Suspicion feedback banner */
  .suspicion-banner-wrap {
    display: flex;
    justify-content: center;
    margin: 6px 0 10px;
  }
  .suspicion-banner {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid;
    white-space: nowrap;
  }
  .sf-none  { background: #ecfdf5; color: #047857; border-color: #6ee7b7; }
  .sf-low   { background: #f7fee7; color: #4d7c0f; border-color: #d9f99d; }
  .sf-mid   { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .sf-high  { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
  .sf-extreme { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

  /* Start card */
  .start-card {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1px solid #e7e5e4;
    border-radius: 16px;
    padding: 20px 24px;
    cursor: pointer;
    transition: border-color .2s;
    text-align: left;
  }
  .start-card:hover { border-color: #a8a29e; }
  .start-card-title { font-weight: 600; margin: 0; }
  .start-card-sub { font-size: 12px; color: #a8a29e; margin: 4px 0 0; }
  .start-icon {
    width: 36px; height: 36px; border-radius: 999px;
    background: #1c1917; color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 16px;
  }

  /* Transition screen */
  .transition-card {
    background: #1c1917;
    border-radius: 16px;
    padding: 26px 24px;
    text-align: center;
  }
  .transition-label {
    color: #a8a29e; font-size: 11px;
    text-transform: uppercase; letter-spacing: .12em;
  }
  .avatar-circle {
    width: 60px; height: 60px; margin: 14px auto;
    border-radius: 999px; background: #292524;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .transition-name { color: #fff; font-size: 20px; font-weight: 700; margin: 0; }
  .transition-sub { color: #a8a29e; font-size: 13px; margin: 4px 0 0; }
  .btn-white {
    width: 100%; background: #fff; color: #1c1917;
    padding: 11px; border-radius: 12px; font-weight: 600;
    border: none; cursor: pointer; margin-top: 18px; font-size: 14px;
  }
  .btn-white:hover { background: #e7e5e4; }

  /* Warning screen */
  .warning-card {
    border-radius: 16px; padding: 22px; text-align: center; border: 1px solid;
  }
  .warning-card.mid { background: #fffbeb; border-color: #fde68a; }
  .warning-card.high { background: #fef2f2; border-color: #fecaca; }
  .warning-title-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .warning-title { font-size: 13px; font-weight: 600; margin: 0; }
  .warning-title.mid { color: #b45309; }
  .warning-title.high { color: #dc2626; }
  .warning-msg-list {
    text-align: left; max-width: 280px; margin: 14px auto 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .warning-msg {
    background: #fff; border: 1px solid #e7e5e4;
    border-radius: 12px; padding: 7px 14px; font-size: 13px;
  }
  .warning-msg-name { color: #a8a29e; margin-right: 4px; }
  .warning-note { font-size: 11px; color: #78716c; margin-top: 14px; }
  .btn-warning {
    width: 100%; padding: 11px; border-radius: 12px;
    font-weight: 600; color: #fff; border: none; cursor: pointer;
    margin-top: 14px; font-size: 14px;
  }
  .btn-warning.mid { background: #d97706; }
  .btn-warning.mid:hover { background: #b45309; }
  .btn-warning.high { background: #ef4444; }
  .btn-warning.high:hover { background: #dc2626; }

  /* LINE 風格聊天卡片 */
  .line-chat-card {
    background: #fff;
    border-radius: 20px;
    border: 1px solid #ececec;
    box-shadow: 0 2px 14px rgba(0,0,0,0.05);
    padding: 0 14px 12px;
    overflow: hidden;
  }
  .line-chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0 10px;
    border-bottom: 1px solid #f0f0f0;
  }
  .line-avatar {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: #fff;
    flex-shrink: 0;
  }
  .line-header-info { flex: 1; min-width: 0; }
  .line-header-name {
    font-size: 14px; font-weight: 700; margin: 0; color: #1c1917;
  }
  .line-header-sub {
    font-size: 10.5px; color: #9ca3af; margin: 2px 0 0;
  }
  .line-header-count {
    font-size: 11px; color: #9ca3af; white-space: nowrap; flex-shrink: 0;
  }

  /* 固定高度計時器插槽，不論是否顯示計時器都保留相同高度，避免版面跳動 */
  .chat-timer-slot {
    min-height: 26px;
    margin: 8px 0 4px;
  }
  .timer-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: #a8a29e; margin-bottom: 3px;
  }
  .timer-value.danger { color: #ef4444; font-weight: 600; }
  .timer-track {
    width: 100%; height: 5px; background: #e7e5e4;
    border-radius: 999px; overflow: hidden;
  }
  .timer-fill { height: 100%; transition: width 1s linear; }

  /* 訊息捲動區：改用視窗高度百分比，並設定上限，避免撐開整個頁面 */
  .chat-scroll {
    background: #fff;
    height: min(46vh, 340px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 2px;
  }
  .chat-scroll::-webkit-scrollbar { width: 6px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 999px; }
  .chat-scroll::-webkit-scrollbar-track { background: transparent; }

  .choice-btn {
    background: #fafaf9; border: 1px solid #e7e5e4;
    color: #292524; border-radius: 18px; border-bottom-right-radius: 4px;
    padding: 10px 14px; max-width: 230px; font-size: 13.5px;
    text-align: left; cursor: pointer; transition: background .15s, border-color .15s;
    white-space: pre-line; line-height: 1.45;
  }
  .choice-btn:hover { background: #f0efed; border-color: #d6d3d1; }

  .confirm-row {
    display: flex; justify-content: flex-end;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid #f0f0f0;
  }
  .confirm-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #1c1917; color: #fff; font-size: 13.5px; font-weight: 500;
    padding: 9px 18px; border-radius: 999px; border: none; cursor: pointer;
  }
  .confirm-btn:hover { background: #292524; }

  .twist-note {
    text-align: center; font-size: 11px; color: #a8a29e; font-style: italic;
  }

  /* Ending screen */
  .ending-hero { text-align: center; padding: 10px 0; }
  .ending-emoji { font-size: 36px; margin-bottom: 6px; }
  .ending-title { font-size: 20px; font-weight: 700; margin: 0; }
  .ending-desc {
    font-size: 13px; color: #57534e; line-height: 1.6;
    text-align: center; padding: 0 12px;
    white-space: pre-line;
  }
  .ending-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px 12px;
    margin-top: 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    border: 1px solid;
  }
  .rank-ss { background: #ecfdf5; color: #047857; border-color: #6ee7b7; }
  .rank-s  { background: #f0fdf4; color: #16a34a; border-color: #86efac; }
  .rank-a  { background: #f7fee7; color: #4d7c0f; border-color: #d9f99d; }
  .rank-b  { background: #fefce8; color: #a16207; border-color: #fde68a; }
  .rank-c  { background: #fffbeb; color: #b45309; border-color: #fcd34d; }
  .rank-d  { background: #fff7ed; color: #c2410c; border-color: #fdba74; }
  .rank-e  { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
  .rank-f  { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

  .stat-card {
    background: #fff; border: 1px solid #e7e5e4;
    border-radius: 16px; padding: 14px;
  }
  .stat-row {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #a8a29e; margin-bottom: 6px;
  }
  .stat-track {
    width: 100%; height: 6px; background: #f0efed;
    border-radius: 999px; overflow: hidden;
  }
  .stat-fill { height: 100%; background: #1c1917; transition: width .3s; }
  .restart-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #1c1917; color: #fff; padding: 11px; border-radius: 12px;
    font-weight: 600; border: none; cursor: pointer; font-size: 14px;
  }
  .restart-btn:hover { background: #292524; }

  /* FAQ */
  .faq-section { padding-top: 64px; padding-bottom: 24px; }
  .faq-label { font-size: 12px; color: #a8a29e; margin-bottom: 16px; }
  .faq-list { border-top: 1px solid #e7e5e4; }
  .faq-item { border-bottom: 1px solid #e7e5e4; }
  .faq-q-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 16px 0;
    text-align: left;
  }
  .faq-q {
    font-weight: 500; font-size: 14px; margin: 0;
    color: #1c1917;
  }
  .faq-chevron {
    flex-shrink: 0;
    font-size: 12px;
    color: #a8a29e;
    transition: transform .15s;
  }
  .faq-a-wrap {
    overflow: hidden;
  }
  .faq-a { font-size: 12px; color: #78716c; line-height: 1.6; margin: 0 0 16px; white-space: pre-line; }

  .disclaimer { font-size: 12px; color: #a8a29e; padding: 0 24px; max-width: 600px; margin: 0 auto; }

  footer {
    max-width: 600px; margin: 24px auto 0; padding: 32px 24px;
    border-top: 1px solid #e7e5e4; display: flex; gap: 16px;
    font-size: 12px; color: #a8a29e;
  }

  /* Utility flex helpers used inline */
  .flex-col { display: flex; flex-direction: column; gap: 6px; }
</style>
</head>

/* ---------------------------------------------------
   工具函式
--------------------------------------------------- */
function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function computePercent(suspicionRaw, roundsCompleted, selectedRounds) {
  if (roundsCompleted === 0) return 0;
  var maxSum = selectedRounds.slice(0, roundsCompleted).reduce(function (sum, r) {
    return sum + Math.max.apply(null, r.choices.map(function (c) { return c.delta; }));
  }, 0);
  if (maxSum === 0) return 0;
  return Math.min(100, Math.round((suspicionRaw / maxSum) * 100));
}

/* 長文案自動換行：只要文字中出現「。」，就在該處自動換行；
   若文字中已有段落分隔（連續兩個換行），則保留該段落間距，
   並在每個段落內部依「。」再細分換行。 */
function breakByPeriod(text) {
  if (!text) return text;
  var endsWithPeriod = text.charAt(text.length - 1) === "。";
  var parts = text.split("。");
  if (endsWithPeriod) parts.pop();
  var result = parts.map(function (p, idx) {
    if (idx < parts.length - 1 || endsWithPeriod) return p + "。";
    return p;
  });
  return result.join("\n");
}

function autoBreakText(text) {
  if (!text) return text;
  var paragraphs = text.split("\n\n");
  var processed = paragraphs.map(function (para) {
    return breakByPeriod(para);
  });
  return processed.join("\n\n");
}

                </div>

                <p className="warning-note">
                  {warningLevel === "high" ? "如果再露餡，你的秘密可能就要曝光了……" : "深呼吸，冷靜一下，接下來的回答要更小心了。"}
                </p>

                <button className={"btn-warning " + warningLevel} onClick={continueFromWarning}>
                  {warningLevel === "high" ? "硬著頭皮撐下去" : "繼續假裝"}
                </button>
              </div>
            )}

            {screen === "chat" && round && (
              <div className="section">
                <div className="line-chat-card">
                  <div className="line-chat-header">
                    <div className="line-avatar" style={{ background: round.color }}>{round.avatar}</div>
                    <div className="line-header-info">
                      <p className="line-header-name">{round.friend}</p>
                      <p className="line-header-sub">
                        週三 21:{String(8 + roundIndex * 6).padStart(2, "0")}
                      </p>
                    </div>
                    <span className="line-header-count">{roundIndex + 1} / {selectedRounds.length}</span>
                  </div>

                  <div className="chat-timer-slot">
                    {chatPhase === "asking" && (
                      <div>
                        <div className="timer-row">
                          <span>⏱ 作答時間</span>
                          <span className={timeLeft <= 3 ? "timer-value danger" : "timer-value"}>{timeLeft} 秒</span>
                        </div>
                        <div className="timer-track">
                          <div className="timer-fill" style={{ width: (timeLeft / ANSWER_TIME * 100) + "%", background: timerColor }} />
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="chat-scroll">
                    <div className="flex-col">
                      {round.messages.map(function (m, i) {
                        return (
                          <div key={i} className="bubble-row incoming">
                            <div className="line-avatar-mini" style={{ background: round.color }}>{round.avatar}</div>
                            <div className="bubble">{m}</div>
                          </div>
                        );
                      })}
                    </div>

                    {chatPhase === "asking" && (
                      <div className="flex-col">
                        {round.choices.map(function (choice, i) {
                          return (
                            <div key={i} className="bubble-row right">
                              <button className="choice-btn" onClick={function () { handleChoice(choice, i); }}>
                                {choice.text}
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {chatPhase === "answered" && (
                      <div className="flex-col">
                        {timedOut ? (
                          <div className="bubble-row right">
                            <div className="bubble timeout">（時間到，訊息已讀不回）</div>
                          </div>
                        ) : (
                          currentChoice && (
                            <div className="bubble-row right">
                              <div className="bubble sent">{currentChoice.text}</div>
                            </div>
                          )
                        )}

                        <div className="suspicion-banner-wrap">
                          <span className={"suspicion-banner " + feedback.cls}>
                            {feedback.emoji} {feedback.label}
                          </span>
                        </div>

                        {Array.isArray(currentReaction) ? (
                          currentReaction.map(function (line, i) {
                            return (
                              <div key={i} className="bubble-row incoming">
                                <div className="line-avatar-mini" style={{ background: round.color }}>{round.avatar}</div>
                                <div className="bubble">{line}</div>
                              </div>
                            );
                          })
                        ) : (
                          <div className="bubble-row incoming">
                            <div className="line-avatar-mini" style={{ background: round.color }}>{round.avatar}</div>
                            <div className="bubble">{currentReaction}</div>
                          </div>
                        )}

                        {round.twist && (
                          <div>
                            <div className="bubble-row incoming">
                              <div className="line-avatar-mini" style={{ background: round.color }}>{round.avatar}</div>
                              <div className="bubble twist">{round.twist}</div>
                            </div>
                            <p className="twist-note">（你突然不知道該說什麼了……）</p>
                          </div>
                        )}
                      </div>
                    )}
                  </div>

                  {chatPhase === "answered" && (
                    <div className="confirm-row">
                      <button className="confirm-btn" onClick={confirmNext}>
                        確定 →
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {screen === "ending" && ending && (
              <div className="section flex-col">
                <div className="ending-hero">
                  <div className="ending-emoji">{ending.emoji}</div>
                  <h2 className="ending-title">{ending.title}</h2>
                  <span className={"ending-badge rank-" + ending.rank.toLowerCase()}>
                    評級 {ending.rank}
                  </span>
                </div>
                <p className="ending-desc">{autoBreakText(ending.desc)}</p>

                <div className="bubble-row incoming ending-quote-row">
                  <div className="line-avatar-mini" style={{ background: "#57534e" }}>💬</div>
                  <div className="bubble">{ending.quoteName}：{ending.quote}</div>
                </div>

                <div className="stat-card">
                  <div className="stat-row">
                    <span>最終破綻值</span>
                    <span>{finalPercent}%</span>
                  </div>
                  <div className="stat-track">
                    <div className="stat-fill" style={{ width: finalPercent + "%", background: rankColors[ending.rank] }} />
                  </div>
                </div>
                <button className="restart-btn" onClick={restart}>↻ 再玩一次</button>
              </div>
            )}

          </div>
        )}
      </main>

      {isIdle && (
        <div>
          <section className="faq-section">
            <p className="faq-label">常見問題</p>
            <FaqAccordion />
          </section>

          <p className="disclaimer">純娛樂用途，兄弟感情破裂請自行負責。</p>

          <footer>
            <span>首頁</span>
            <span>關於</span>
            <span>意見回饋</span>
          </footer>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
